<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">Douglas Zulim quality engineering stack</title>
  <desc id="description">Confirmed testing tools, languages, data, delivery and quality practices grouped by capability.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06b6d4"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  </defs>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .label { fill: #475569; font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.4px; }
    .item { fill: #0f172a; font: 600 17px system-ui, -apple-system, Segoe UI, sans-serif; }
    .meta { fill: #64748b; font: 400 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    @media (prefers-color-scheme: dark) { .panel { fill: #0d1117; stroke: #30363d; } .label { fill: #8b949e; } .item { fill: #f0f6fc; } .meta { fill: #8b949e; } }
  </style>
  <rect x="1" y="1" width="1198" height="348" rx="22" class="panel"/>
  <rect x="40" y="36" width="1120" height="3" rx="1.5" fill="url(#accent)"/>

  <g transform="translate(54 76)">
    <text class="label">AUTOMATION</text>
    <g transform="translate(0 30)">
      <circle cx="9" cy="-5" r="5" fill="#06b6d4"/><text class="item" x="24">Playwright</text>
      <circle cx="9" cy="31" r="5" fill="#06b6d4"/><text class="item" x="24" y="36">Postman</text>
      <circle cx="9" cy="67" r="5" fill="#06b6d4"/><text class="item" x="24" y="72">Selenium</text>
      <circle cx="9" cy="103" r="5" fill="#06b6d4"/><text class="item" x="24" y="108">Manual testing</text>
    </g>
    <text class="meta" y="194">Web · API · Desktop</text>
  </g>

  <g transform="translate(344 76)">
    <text class="label">LANGUAGES + DATA</text>
    <g transform="translate(0 30)">
      <circle cx="9" cy="-5" r="5" fill="#6366f1"/><text class="item" x="24">TypeScript</text>
      <circle cx="9" cy="31" r="5" fill="#6366f1"/><text class="item" x="24" y="36">Python</text>
      <circle cx="9" cy="67" r="5" fill="#6366f1"/><text class="item" x="24" y="72">SQL</text>
      <circle cx="9" cy="103" r="5" fill="#6366f1"/><text class="item" x="24" y="108">Data analysis</text>
    </g>
    <text class="meta" y="194">Checks · fixtures · investigation</text>
  </g>

  <g transform="translate(644 76)">
    <text class="label">DELIVERY</text>
    <g transform="translate(0 30)">
      <circle cx="9" cy="-5" r="5" fill="#8b5cf6"/><text class="item" x="24">Git</text>
      <circle cx="9" cy="31" r="5" fill="#8b5cf6"/><text class="item" x="24" y="36">Jira</text>
      <circle cx="9" cy="67" r="5" fill="#8b5cf6"/><text class="item" x="24" y="72">CI/CD</text>
      <circle cx="9" cy="103" r="5" fill="#8b5cf6"/><text class="item" x="24" y="108">Scrum + Kanban</text>
    </g>
    <text class="meta" y="194">Versioning · delivery · collaboration</text>
  </g>

  <g transform="translate(944 76)">
    <text class="label">PRACTICE</text>
    <g transform="translate(0 30)">
      <circle cx="9" cy="-5" r="5" fill="#a855f7"/><text class="item" x="24">Acceptance criteria</text>
      <circle cx="9" cy="31" r="5" fill="#a855f7"/><text class="item" x="24" y="36">Integration</text>
      <circle cx="9" cy="67" r="5" fill="#a855f7"/><text class="item" x="24" y="72">Regression</text>
      <circle cx="9" cy="103" r="5" fill="#a855f7"/><text class="item" x="24" y="108">Defect analysis</text>
    </g>
    <text class="meta" y="194">Risk · evidence · feedback</text>
  </g>

  <text class="meta" x="54" y="316">Grouped by outcomes—not by logo count.</text>
</svg>
