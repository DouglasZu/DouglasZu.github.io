    <text x="76" y="54" class="title">Ready for the first automated update</text>
    <text x="76" y="88" class="copy">Run Actions → Profile metrics after publishing DouglasZu/DouglasZu.</text>
    <text x="76" y="116" class="copy">This card will show public contributions, repositories, pull requests, issues, stars and languages.</text>
