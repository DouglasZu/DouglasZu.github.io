<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Douglas Zulim, Quality Assurance Engineer</title>
  <desc id="description">A restrained quality engineering banner with a release pipeline moving from strategy to confidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.5" stop-color="#101524"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".23"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="946" cy="34" r="250" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M0 252C190 224 310 281 488 252s306-39 422-8 190 25 290-4v60H0Z" fill="#818cf8" fill-opacity=".045"/>
  <path d="M0 267C180 238 312 293 497 263s301-38 414-7 187 27 289-2" fill="none" stroke="url(#accent)" stroke-opacity=".42"/>

  <g transform="translate(72 62)">
    <rect width="84" height="84" rx="22" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".16"/>
    <path d="M23 43.5 36.5 57 62 28" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="126" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2.3">QUALITY / ENGINEERING</text>
  </g>

  <g transform="translate(515 84)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <path d="M0 42H500" stroke="#64748b" stroke-opacity=".35" stroke-dasharray="5 9"/>
    <g transform="translate(0)">
      <circle cx="18" cy="42" r="18" fill="#111827" stroke="#67e8f9" stroke-width="2"/>
      <path d="m10 42 5 5 11-12" fill="none" stroke="#67e8f9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="88" fill="#cbd5e1" font-size="13">STRATEGY</text>
    </g>
    <g transform="translate(155)">
      <circle cx="18" cy="42" r="18" fill="#111827" stroke="#818cf8" stroke-width="2"/>
      <path d="M11 42h14M18 35v14" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round"/>
      <text x="-8" y="88" fill="#cbd5e1" font-size="13">AUTOMATION</text>
    </g>
    <g transform="translate(325)">
      <circle cx="18" cy="42" r="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <path d="M9 42h18M13 36l-6 6 6 6M23 36l6 6-6 6" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="2" y="88" fill="#cbd5e1" font-size="13">FEEDBACK</text>
    </g>
    <g transform="translate(482)">
      <circle cx="18" cy="42" r="18" fill="#111827" stroke="#c084fc" stroke-width="2"/>
      <path d="m10 42 5 5 11-12" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-16" y="88" fill="#cbd5e1" font-size="13">CONFIDENCE</text>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="23.25" fill="none" stroke="#a5b4fc" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
