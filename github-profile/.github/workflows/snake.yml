name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * 1"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%236366f1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a5b4fc
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish generated assets to output branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: refresh contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
