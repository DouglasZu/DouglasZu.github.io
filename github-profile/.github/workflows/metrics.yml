name: Profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/generate-metrics.mjs"
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate self-hosted public metrics
        run: node scripts/generate-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated SVG
        shell: bash
        run: |
          if git diff --quiet -- assets/metrics.svg; then
            echo "Metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg
          git commit -m "chore: refresh profile metrics"
          git push
